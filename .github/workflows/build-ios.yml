name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      free_quota_confirmed:
        description: '已确认本次使用免费 Actions 额度，超额付费预算为 0'
        required: true
        default: false
        type: boolean
      publish_release:
        description: '构建成功后发布到 GitHub Releases（标签 v<版本号>，已存在则失败，不覆盖）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: duocue-manual-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.free_quota_confirmed }}
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact toolchain and project
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | python3 -c 'import sys; assert sys.stdin.read().strip() == "27.1", "iOS 27.1 SDK required"'
          python3 scripts/generate_project.py --check
          python3 scripts/check_project.py
          python3 -m unittest discover -s scripts/tests -v
          plutil -lint DuoCue/Info.plist DuoCue/PrivacyInfo.xcprivacy DuoCue.xcodeproj/project.pbxproj
      - name: Run unit tests on an available iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -d DuoCueTests ] && find DuoCueTests -name '*.swift' -print -quit | grep -q .; then
            SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 scripts/select_simulator.py)"
            test -n "$SIMULATOR_ID"
            xcodebuild test -project DuoCue.xcodeproj -scheme DuoCue -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
          else
            echo 'No Swift XCTest sources yet; packaging tests and iOS app compilation remain required.'
          fi
      - name: Archive unsigned arm64 app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project DuoCue.xcodeproj -scheme DuoCue -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/DuoCue.xcarchive -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          python3 scripts/package_ipa.py build/DuoCue.xcarchive/Products/Applications/DuoCue.app build/DuoCue-unsigned.ipa
          shasum -a 256 build/DuoCue-unsigned.ipa > build/DuoCue-unsigned.ipa.sha256
      - name: Upload unsigned IPA and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DuoCue-unsigned-${{ github.run_number }}
          path: |
            build/DuoCue-unsigned.ipa
            build/DuoCue-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish unsigned IPA to GitHub Releases
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APP_PLIST=build/DuoCue.xcarchive/Products/Applications/DuoCue.app/Info.plist
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PLIST")"
          TAG="v$VERSION"
          ASSET="DuoCue-$VERSION-unsigned.ipa"
          cp build/DuoCue-unsigned.ipa "build/$ASSET"
          (cd build && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          NOTES="docs/RELEASE-$VERSION.md"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; echo; fi
            echo '---'
            echo "未签名 IPA（arm64，build ${BUILD}）。需用 SideStore / AltStore 等工具以自己的 Apple ID 签名后安装。"
            echo "SHA-256：\`$(cut -d' ' -f1 "build/${ASSET}.sha256")\`"
          } > build/release-notes.md
          gh release create "$TAG" "build/$ASSET" "build/$ASSET.sha256" \
            --target "$GITHUB_SHA" --title "DuoCue $VERSION" --notes-file build/release-notes.md
      - name: Export visual review attachments
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/test-attachments
          fi
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DuoCue-test-report-${{ github.run_number }}
          path: |
            build/Tests.xcresult
            build/test-attachments
          if-no-files-found: ignore
          retention-days: 3
